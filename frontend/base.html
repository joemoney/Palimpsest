<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{% block title %}Palimpsest{% endblock %}</title>
    <script src="{{ url_for('static', filename='htmx.min.js') }}"></script>
    <script>
      // Applied before first paint (plain synchronous <head> script, not deferred) so a
      // viewer who's hidden the topbar doesn't see it flash visible for a frame on every
      // page load. localStorage, not account state - a per-browser reading preference,
      // not something that should follow the player to a different device.
      (function () {
        try {
          if (localStorage.getItem("palimpsest-topbar-hidden") === "1") {
            document.documentElement.classList.add("topbar-hidden");
          }
        } catch (e) {}
      })();
    </script>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-2: #1f2937;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #8b5cf6;
        --accent-2: #22c55e;
        --danger: #f87171;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(180deg, #020817 0%, #0f172a 100%);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 16px;
      }

      .app {
        width: 100%;
        max-width: 560px;
        min-height: calc(100vh - 32px);
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 18px;
        padding: 14px 16px;
        backdrop-filter: blur(10px);
        position: sticky;
        /* Matches body's own 16px padding, so the floating header keeps the same
           breathing room from the viewport edge once stuck as it has at rest. */
        top: 16px;
        z-index: 20;
      }

      .title { font-size: 1.1rem; font-weight: 700; }

      .topbar a {
        color: var(--muted);
        font-size: 0.85rem;
        text-decoration: none;
      }
      .topbar a:hover { color: var(--text); }

      .icon {
        width: 20px;
        height: 20px;
        display: block;
      }
      .icon-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      button.icon-link {
        appearance: none;
        border: none;
        background: none;
        padding: 0;
        color: var(--muted);
      }
      button.icon-link:hover { filter: none; color: var(--text); }

      .card {
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 20px;
        padding: 18px;
      }

      .story {
        font-size: 1.05rem;
        line-height: 1.7;
        margin: 0;
        white-space: pre-wrap;
      }

      code {
        background: rgba(148, 163, 184, 0.15);
        border-radius: 4px;
        padding: 1px 5px;
        font-size: 0.9em;
      }

      label {
        display: block;
        font-size: 0.75rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 6px;
      }

      input[type="text"], input[type="password"], textarea, select {
        width: 100%;
        background: rgba(31, 41, 55, 0.8);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 12px;
        color: var(--text);
        padding: 12px 14px;
        font-size: 1rem;
        font-family: inherit;
      }
      select { appearance: auto; }

      input[type="checkbox"] {
        width: auto;
        accent-color: var(--accent);
        margin-right: 6px;
      }
      .checkbox-label {
        display: flex;
        align-items: center;
        text-transform: none;
        letter-spacing: normal;
        font-size: 0.9rem;
        color: var(--text);
      }

      button {
        appearance: none;
        border: 1px solid rgba(139, 92, 246, 0.6);
        border-radius: 14px;
        background: linear-gradient(180deg, rgba(139, 92, 246, 0.18), rgba(30, 41, 59, 0.9));
        color: var(--text);
        text-align: center;
        padding: 12px 16px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { filter: brightness(1.15); }

      form { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }

      .story-list { display: flex; flex-direction: column; gap: 10px; }
      .story-list a {
        display: block;
        text-decoration: none;
        color: var(--text);
      }
      .story-list .card:hover { border-color: rgba(139, 92, 246, 0.6); }

      .choices { display: flex; flex-direction: column; gap: 10px; }
      .choices form { margin-top: 0; }
      .choice {
        width: 100%;
        text-align: left;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }
      .choice-action { font-weight: 600; }
      .choice-prose {
        font-weight: 400;
        font-style: italic;
        color: var(--muted);
        font-size: 0.85rem;
        line-height: 1.4;
      }

      .player-turn {
        display: flex;
        justify-content: flex-end;
      }
      .player-bubble {
        background: var(--panel-2);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 16px;
        padding: 10px 14px;
        max-width: 80%;
        font-style: italic;
        color: var(--text);
        margin: 0;
        white-space: pre-wrap;
      }

      #scene-list {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .post-narration {
        display: flex;
        flex-direction: column;
        gap: 16px;
        border: none;
        margin: 0;
        padding: 0;
        min-width: 0;
      }
      .post-narration.hidden { display: none; }
      #controls.htmx-request { opacity: 0.6; }
      #controls:disabled .choice,
      #controls:disabled .icon-button,
      #controls:disabled button { cursor: not-allowed; }

      .busy-indicator {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--panel-2);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 999px;
        padding: 10px 18px;
        font-size: 0.85rem;
        color: var(--text);
        box-shadow: 0 8px 24px rgba(2, 8, 23, 0.45);
        opacity: 0;
        pointer-events: none;
        transition: opacity 150ms ease-in;
        z-index: 50;
      }
      .busy-indicator.htmx-request { opacity: 1; }
      .spinner-ring {
        width: 16px;
        height: 16px;
        border: 2px solid rgba(229, 231, 235, 0.25);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        flex-shrink: 0;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .scene-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .scene-actions form { margin: 0; }
      .icon-button {
        width: auto;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 500;
      }

      .error {
        color: var(--danger);
        font-size: 0.9rem;
      }

      .end-marker {
        text-align: center;
        color: var(--muted);
        letter-spacing: 0.1em;
        font-size: 0.8rem;
        text-transform: uppercase;
        margin-top: 8px;
      }

      .topbar-right {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      html.topbar-hidden .topbar { display: none; }

      .topbar-show-tab {
        appearance: none;
        display: none;
        position: fixed;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        align-items: center;
        justify-content: center;
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-top: none;
        border-radius: 0 0 12px 12px;
        padding: 4px 16px 5px;
        color: var(--muted);
        cursor: pointer;
        z-index: 21;
      }
      .topbar-show-tab:hover { color: var(--text); }
      html.topbar-hidden .topbar-show-tab { display: flex; }

      .dropdown { position: relative; }
      .dropdown summary {
        list-style: none;
        cursor: pointer;
        color: var(--muted);
        font-size: 0.85rem;
        display: inline-flex;
        align-items: center;
        gap: 2px;
      }
      .dropdown summary:hover { color: var(--text); }
      .dropdown summary::-webkit-details-marker { display: none; }
      .dropdown summary::after { content: "\25BE"; font-size: 0.7rem; }
      .dropdown[open] summary::after { content: "\25B4"; }
      .dropdown-menu {
        position: absolute;
        right: 0;
        top: calc(100% + 8px);
        min-width: 180px;
        background: var(--panel-2);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 14px;
        padding: 6px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        z-index: 10;
      }
      .dropdown-menu a {
        display: block;
        padding: 8px 10px;
        border-radius: 8px;
        color: var(--text);
        text-decoration: none;
        font-size: 0.9rem;
      }
      .dropdown-menu a:hover { background: rgba(139, 92, 246, 0.18); }

      details.card summary {
        cursor: pointer;
        font-weight: 700;
        list-style: none;
      }
      details.card summary::-webkit-details-marker { display: none; }
      details.card summary::before { content: "\25B8  "; color: var(--muted); }
      details.card[open] summary::before { content: "\25BE  "; }
      details.card + details.card { margin-top: 12px; }

      .warning-banner {
        border-color: rgba(248, 113, 113, 0.4);
        color: var(--text);
        font-size: 0.9rem;
        line-height: 1.5;
      }
      .warning-banner strong { color: var(--danger); }

      dialog {
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 20px;
        padding: 20px;
        max-width: 440px;
        width: calc(100% - 32px);
        font-family: inherit;
      }
      dialog::backdrop {
        background: rgba(2, 8, 23, 0.75);
        backdrop-filter: blur(2px);
      }

      .subplot-progress {
        height: 6px;
        border-radius: 3px;
        background: rgba(148, 163, 184, 0.2);
        overflow: hidden;
        margin-top: 6px;
      }
      .subplot-progress-fill {
        height: 100%;
        background: var(--accent);
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="title">{% block header_title %}Palimpsest{% endblock %}</div>
        <div class="topbar-right">
          {% if story_slug %}
          <a href="{{ url_for('stories') }}" class="icon-link" title="Back to your stories" aria-label="Back to your stories">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
              <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
            </svg>
          </a>
          <details class="dropdown">
            <summary title="Manage" aria-label="Manage">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
              </svg>
            </summary>
            <div class="dropdown-menu">
              <a href="{{ url_for('play', story_slug=story_slug) }}">Play</a>
              <a href="{{ url_for('plot_manager_view', story_slug=story_slug) }}">Plot Manager</a>
              <a href="{{ url_for('subplot_manager_view', story_slug=story_slug) }}">Subplot Manager</a>
            </div>
          </details>
          {% endif %}
          {% if session.get('username') %}
            <a href="{{ url_for('help_page', story_slug=story_slug) if story_slug else url_for('help_page') }}" class="icon-link" title="Help" aria-label="Help">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
              </svg>
            </a>
            <a href="{{ url_for('logout') }}" class="icon-link" title="Log out ({{ session['username'] }})" aria-label="Log out ({{ session['username'] }})">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
              </svg>
            </a>
          {% endif %}
          <button type="button" id="topbar-hide-btn" class="icon-link" title="Hide title bar" aria-label="Hide title bar">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="18 15 12 9 6 15"></polyline>
            </svg>
          </button>
        </div>
      </header>
      <button type="button" id="topbar-show-btn" class="topbar-show-tab" title="Show title bar" aria-label="Show title bar">
        <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
      {% block content %}{% endblock %}
    </main>
    <script>
      (function () {
        var STORAGE_KEY = "palimpsest-topbar-hidden";
        function setHidden(hidden) {
          document.documentElement.classList.toggle("topbar-hidden", hidden);
          try { localStorage.setItem(STORAGE_KEY, hidden ? "1" : "0"); } catch (e) {}
        }
        document.getElementById("topbar-hide-btn").addEventListener("click", function () { setHidden(true); });
        document.getElementById("topbar-show-btn").addEventListener("click", function () { setHidden(false); });
      })();
    </script>
    {% block scripts %}{% endblock %}
  </body>
</html>
