<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{% block title %}Palimpsest{% endblock %}</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-2: #1f2937;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #8b5cf6;
        --accent-2: #22c55e;
        --danger: #f87171;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(180deg, #020817 0%, #0f172a 100%);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 16px;
      }

      .app {
        width: 100%;
        max-width: 560px;
        min-height: calc(100vh - 32px);
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 18px;
        padding: 14px 16px;
        backdrop-filter: blur(10px);
      }

      .title { font-size: 1.1rem; font-weight: 700; }

      .topbar a {
        color: var(--muted);
        font-size: 0.85rem;
        text-decoration: none;
      }
      .topbar a:hover { color: var(--text); }

      .card {
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 20px;
        padding: 18px;
      }

      .story {
        font-size: 1.05rem;
        line-height: 1.7;
        margin: 0;
        white-space: pre-wrap;
      }

      label {
        display: block;
        font-size: 0.75rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 6px;
      }

      input[type="text"], input[type="password"], textarea {
        width: 100%;
        background: rgba(31, 41, 55, 0.8);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 12px;
        color: var(--text);
        padding: 12px 14px;
        font-size: 1rem;
        font-family: inherit;
      }

      button {
        appearance: none;
        border: 1px solid rgba(139, 92, 246, 0.6);
        border-radius: 14px;
        background: linear-gradient(180deg, rgba(139, 92, 246, 0.18), rgba(30, 41, 59, 0.9));
        color: var(--text);
        text-align: center;
        padding: 12px 16px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { filter: brightness(1.15); }

      form { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }

      .story-list { display: flex; flex-direction: column; gap: 10px; }
      .story-list a {
        display: block;
        text-decoration: none;
        color: var(--text);
      }
      .story-list .card:hover { border-color: rgba(139, 92, 246, 0.6); }

      .choices { display: flex; flex-direction: column; gap: 10px; }
      .choices form { margin-top: 0; }
      .choice {
        width: 100%;
        text-align: left;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }
      .choice-action { font-weight: 600; }
      .choice-prose {
        font-weight: 400;
        font-style: italic;
        color: var(--muted);
        font-size: 0.85rem;
        line-height: 1.4;
      }

      .scene-divider {
        border: none;
        border-top: 1px solid rgba(148, 163, 184, 0.25);
        margin: 0;
      }
      .player-action {
        font-size: 1.05rem;
        line-height: 1.7;
        font-style: italic;
        color: var(--muted);
        margin: 0;
        white-space: pre-wrap;
      }

      .error {
        color: var(--danger);
        font-size: 0.9rem;
      }

      .end-marker {
        text-align: center;
        color: var(--muted);
        letter-spacing: 0.1em;
        font-size: 0.8rem;
        text-transform: uppercase;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="title">{% block header_title %}Palimpsest{% endblock %}</div>
        {% if session.get('username') %}
          <a href="{{ url_for('logout') }}">Log out ({{ session['username'] }})</a>
        {% endif %}
      </header>
      {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
  </body>
</html>
